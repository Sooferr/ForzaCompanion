<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FH6 R998 Car Picker</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e222d;
    --border: #2a2f3d;
    --accent: #c8f04a;
    --accent-dim: #8aaa2a;
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --gold: #f5c842;
    --silver: #9db4c0;
    --bronze: #c97b3a;
    --tag-bg: #232736;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f5f7fa;
      --border: #dde1ea;
      --text: #111318;
      --text-muted: #6b7280;
      --text-dim: #4b5563;
      --tag-bg: #ebedf2;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  header p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .accent { color: var(--accent); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    margin-top: 28px;
  }

  .track-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  @media (max-width: 480px) {
    .track-grid { grid-template-columns: 1fr; }
  }

  .track-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text-dim);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .track-btn:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .track-btn.selected {
    border-color: var(--accent);
    background: var(--surface2);
    color: var(--text);
  }

  .track-btn .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }

  .track-btn.selected .dot {
    background: var(--accent);
    border-color: var(--accent);
  }

  .track-type {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
    flex-shrink: 0;
  }

  .selected-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .selected-tag {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .btn-analyze {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: var(--accent);
    color: #0d0f14;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-analyze:hover { opacity: 0.88; }
  .btn-analyze:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-clear {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .btn-clear:hover { color: var(--text); border-color: var(--text-muted); }

  .results {
    margin-top: 32px;
  }

  .pick-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .pick-card.pick1 { border-color: var(--accent); }
  .pick-card.pick2 { border-color: var(--border); }

  .pick-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .pick-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .pick1 .pick-badge { background: var(--accent); color: #0d0f14; }
  .pick2 .pick-badge { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

  .pick-car {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .pick-score {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .track-breakdown {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .track-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 8px;
  }

  .track-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .track-weight {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
  }

  .track-weight.low { color: var(--text-muted); }
  .track-weight.mid { color: var(--gold); }

  .wr-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    background: rgba(245,200,66,0.1);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .no-data {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .note {
    font-size: 12px;
    color: var(--text-muted);
    padding: 10px 14px;
    background: var(--surface2);
    border-left: 3px solid var(--accent-dim);
    border-radius: 0 6px 6px 0;
    margin-top: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>FH6 <span class="accent">R998</span> Car Picker</h1>
  <p>Select up to 3 tracks — get your best car recommendation</p>
</header>

<main>
  <div class="section-label">Circuits</div>
  <div class="track-grid" id="circuit-grid"></div>

  <div class="section-label" style="margin-top:20px">Sprints</div>
  <div class="track-grid" id="sprint-grid"></div>

  <div class="selected-bar" id="selected-bar">
    <span id="selected-label">No tracks selected</span>
  </div>

  <button class="btn-analyze" id="btn-analyze" disabled onclick="analyze()">Get Recommendation</button>
  <button class="btn-clear" onclick="clearAll()">Clear selection</button>

  <div class="results" id="results"></div>
</main>

<script>

ght":1.4,"appearances":1,"best_rank":47,"podiums":0,"wr":0}],"Irokawa Circuit":[{"car":"2018 Lotus 00 Exige WTA","weight":76.3,"appearances":24,"best_rank":1,"podiums":3,"wr":1},{"car":"1993 Nissan 32 Skyline WTA","weight":23.7,"appearances":26,"best_rank":8,"podiums":0,"wr":0}],"Ito Sprint":[{"car":"2020 Lotus Evija FE","weight":35.9,"appearances":1,"best_rank":1,"podiums":1,"wr":1},{"car":"2008 Mazda Furai","weight":23.2,"appearances":10,"best_rank":3,"podiums":1,"wr":0},{"car":"Mazda MX-5 FE '94","weight":22.3,"appearances":3,"best_rank":2,"podiums":1,"wr":0},{"car":"1991 Mazda 55 787 B","weight":18.6,"appearances":28,"best_rank":6,"podiums":0,"wr":0}],"Legendary Island Circuit":[{"car":"1991 Mazda 55 787 B","weight":50.0,"appearances":1,"best_rank":12,"podiums":0,"wr":0},{"car":"2008 Mazda Furai","weight":35.0,"appearances":43,"best_rank":3,"podiums":1,"wr":0},{"car":"Mazda MX-5 FE '94","weight":12.0,"appearances":3,"best_rank":1,"podiums":2,"wr":1},{"car":"2020 Lotus Evija FE","weight":3.0,"appearances":1,"best_rank":22,"podiums":0,"wr":0}],"Narai-juku Circuit":[{"car":"2018 Lotus 00 Exige WTA","weight":100.0,"appearances":47,"best_rank":1,"podiums":3,"wr":1}],"Satta Sprint":[{"car":"2020 Lotus Evija FE","weight":100.0,"appearances":41,"best_rank":6,"podiums":0,"wr":0}],"Seaside Park Sprint":[{"car":"1991 Mazda 55 787 B","weight":45.0,"appearances":16,"best_rank":22,"podiums":0,"wr":0},{"car":"Mazda MX-5 FE '94","weight":35.0,"appearances":17,"best_rank":1,"podiums":3,"wr":1},{"car":"2008 Mazda Furai","weight":12.0,"appearances":7,"best_rank":17,"podiums":0,"wr":0},{"car":"2020 Lotus Evija FE","weight":8.0,"appearances":1,"best_rank":4,"podiums":0,"wr":0}],"Shikisai Sprint":[{"car":"1991 Mazda 55 787 B","weight":40.0,"appearances":8,"best_rank":12,"podiums":0,"wr":0},{"car":"2018 Lotus 00 Exige WTA","weight":30.0,"appearances":8,"best_rank":5,"podiums":1,"wr":0},{"car":"Mazda MX-5 FE '94","weight":20.0,"appearances":9,"best_rank":2,"podiums":1,"wr":0},{"car":"2008 Mazda Furai","weight":7.0,"appearances":17,"best_rank":5,"podiums":0,"wr":0},{"car":"2020 Lotus Evija FE","weight":3.0,"appearances":4,"best_rank":1,"podiums":2,"wr":1}],"Shimanoyama Circuit":[{"car":"1993 Nissan 32 Skyline WTA","weight":96.3,"appearances":49,"best_rank":1,"podiums":3,"wr":1},{"car":"2018 Lotus 00 Exige WTA","weight":3.7,"appearances":1,"best_rank":10,"podiums":0,"wr":0}],"Shimanoyama Sprint":[{"car":"Mazda MX-5 FE '94","weight":72.5,"appearances":20,"best_rank":1,"podiums":3,"wr":1},{"car":"2008 Mazda Furai","weight":21.8,"appearances":24,"best_rank":9,"podiums":0,"wr":0},{"car":"1991 Mazda 55 787 B","weight":4.3,"appearances":4,"best_rank":24,"podiums":0,"wr":0},{"car":"2018 Lotus 00 Exige WTA","weight":1.4,"appearances":1,"best_rank":44,"podiums":0,"wr":0}],"Shirakawa Circuit":[{"car":"2018 Lotus 00 Exige WTA","weight":100.0,"appearances":50,"best_rank":1,"podiums":3,"wr":1}],"Soni Circuit":[{"car":"2018 Lotus 00 Exige WTA","weight":89.9,"appearances":43,"best_rank":1,"podiums":3,"wr":1},{"car":"1993 Nissan 32 Skyline WTA","weight":10.1,"appearances":7,"best_rank":6,"podiums":0,"wr":0}],"Tateyama Kurobe Sprint":[{"car":"2018 Lotus 00 Exige WTA","weight":95.3,"appearances":45,"best_rank":1,"podiums":3,"wr":1},{"car":"1993 Nissan 32 Skyline WTA","weight":2.4,"appearances":2,"best_rank":37,"podiums":0,"wr":0},{"car":"1991 Mazda 55 787 B","weight":2.3,"appearances":2,"best_rank":43,"podiums":0,"wr":0}],"The Colossus":[{"car":"2020 Lotus Evija FE","weight":100.0,"appearances":14,"best_rank":10,"podiums":0,"wr":0}],"The Goliath":[{"car":"1991 Mazda 55 787 B","weight":100.0,"appearances":48,"best_rank":1,"podiums":3,"wr":1}],"Tokyo Railway Sprint":[{"car":"2018 Lotus 00 Exige WTA","weight":57.8,"appearances":20,"best_rank":1,"podiums":2,"wr":1},{"car":"Mazda MX-5 FE '94","weight":19.2,"appearances":1,"best_rank":2,"podiums":1,"wr":0},{"car":"1991 Mazda 55 787 B","weight":15.9,"appearances":17,"best_rank":5,"podiums":0,"wr":0},{"car":"2008 Mazda Furai","weight":5.6,"appearances":5,"best_rank":10,"podiums":0,"wr":0}],"Venus Sprint":[{"car":"Mazda MX-5 FE '94","weight":48.2,"appearances":4,"best_rank":1,"podiums":2,"wr":1},{"car":"1991 Mazda 55 787 B","weight":41.9,"appearances":36,"best_rank":2,"podiums":1,"wr":0},{"car":"2008 Mazda Furai","weight":5.7,"appearances":6,"best_rank":12,"podiums":0,"wr":0},{"car":"2020 Lotus Evija FE","weight":2.9,"appearances":1,"best_rank":10,"podiums":0,"wr":0},{"car":"2018 Lotus 00 Exige WTA","weight":1.3,"appearances":1,"best_rank":36,"podiums":0,"wr":0}]};

const CIRCUITS = ["Daikoku Circuit","Edamame Circuit","Electric Town Circuit","Highway Circuit","Hokubu Circuit","Irokawa Circuit","Legendary Island Circuit","Narai-juku Circuit","Shimanoyama Circuit","Shirakawa Circuit","Soni Circuit"];
const SPRINTS = ["Coastline Sprint","Festival Sprint","Ito Sprint","Satta Sprint","Seaside Park Sprint","Shikisai Sprint","Shimanoyama Sprint","Tateyama Kurobe Sprint","The Colossus","The Goliath","Tokyo Railway Sprint","Venus Sprint"];

let selected = [];

function init() {
  renderGrid('circuit-grid', CIRCUITS);
  renderGrid('sprint-grid', SPRINTS);
}

function renderGrid(id, tracks) {
  const grid = document.getElementById(id);
  tracks.forEach(track => {
    const btn = document.createElement('button');
    btn.className = 'track-btn';
    btn.id = 'btn-' + track;
    btn.onclick = () => toggleTrack(track);
    btn.innerHTML = `<span class="dot"></span><span style="flex:1">${track}</span>`;
    grid.appendChild(btn);
  });
}

function toggleTrack(track) {
  if (selected.includes(track)) {
    selected = selected.filter(t => t !== track);
  } else {
    if (selected.length >= 3) return;
    selected.push(track);
  }
  updateUI();
}

function updateUI() {
  document.querySelectorAll('.track-btn').forEach(btn => btn.classList.remove('selected'));
  selected.forEach(t => {
    const btn = document.getElementById('btn-' + t);
    if (btn) btn.classList.add('selected');
  });

  const bar = document.getElementById('selected-bar');
  const label = document.getElementById('selected-label');
  if (selected.length === 0) {
    label.innerHTML = '<span>No tracks selected</span>';
  } else {
    label.innerHTML = selected.map(t => `<span class="selected-tag">${t}</span>`).join('');
  }

  document.getElementById('btn-analyze').disabled = selected.length === 0;
  document.getElementById('results').innerHTML = '';
}

function clearAll() {
  selected = [];
  updateUI();
}

function analyze() {
  const scores = {};
  selected.forEach(track => {
    const cars = DATA[track] || [];
    cars.forEach(c => {
      if (!scores[c.car]) scores[c.car] = { total: 0, tracks: {} };
      scores[c.car].total += c.weight;
      scores[c.car].tracks[track] = c;
    });
  });

  const ranked = Object.entries(scores).sort((a, b) => b[1].total - a[1].total);
  if (ranked.length === 0) {
    document.getElementById('results').innerHTML = '<div class="empty-state"><div class="icon">🚗</div>No data for selected tracks.</div>';
    return;
  }

  const pick1 = ranked[0];
  const pick2 = ranked.length > 1 ? ranked[1] : null;

  let html = `<div class="section-label">Recommendation</div>`;
  html += renderPick(pick1, 'pick1', '🥇 Pick 1');
  if (pick2) html += renderPick(pick2, 'pick2', '⬆️ Pick 2');

  document.getElementById('results').innerHTML = html;
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderPick(entry, cls, label) {
  const [car, data] = entry;
  let html = `<div class="pick-card ${cls}">
    <div class="pick-header">
      <span class="pick-badge">${label}</span>
      <div>
        <div class="pick-car">${car}</div>
        <div class="pick-score">Combined score: ${data.total.toFixed(1)}</div>
      </div>
    </div>
    <div class="track-breakdown">`;

  selected.forEach(track => {
    const td = data.tracks[track];
    if (td) {
      const wClass = td.weight >= 50 ? '' : td.weight >= 20 ? 'mid' : 'low';
      html += `<div class="track-row">
        <span class="track-name">${track}</span>
        ${td.wr ? '<span class="wr-badge">WR</span>' : ''}
        <span class="track-weight ${wClass}">${td.weight.toFixed(1)}%</span>
      </div>`;
    } else {
      html += `<div class="track-row">
        <span class="track-name">${track}</span>
        <span class="no-data">No data</span>
        <span class="track-weight low">0%</span>
      </div>`;
    }
  });

  html += `</div></div>`;
  return html;
}

init();
</script>
</body>
</html>
